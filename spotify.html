<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - WebPlayer: Music for Everyone</title>
    <link rel="stylesheet" href="spotify.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="fullContainer flex justify-content">
        <div class="left">
            <div class="homeBox bg-grey rounded m-1">
                <div class="mainIcon flex align-items">
                    <img class="invert" src="logo.svg" alt="">
                    <h1>Spotify</h1>
                    <img class="left-close invert" src="close.svg" alt="">
                </div>
                <div class="homeOptions">
                    <ul>
                        <li><img class="invert" src="home.svg" alt="Home"> Home</li>
                        <li><img class="invert" src="search.svg" alt="Search">Search</li>
                    </ul>
                </div>
            </div>
            <div class="libraryBox bg-grey rounded m-1">
                <div class="libIcon flex justify-content align-items">
                    <svg class="invert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none" stroke="#141B34" stroke-width="1.5" stroke-linecap="square">
                        <path
                            d="M16.2627 10.5H7.73725C5.15571 10.5 3.86494 10.5 3.27143 11.3526C2.67793 12.2052 3.11904 13.4258 4.00126 15.867L5.08545 18.867C5.54545 20.1398 5.77545 20.7763 6.2889 21.1381C6.80235 21.5 7.47538 21.5 8.82143 21.5H15.1786C16.5246 21.5 17.1976 21.5 17.7111 21.1381C18.2245 20.7763 18.4545 20.1398 18.9146 18.867L19.9987 15.867C20.881 13.4258 21.3221 12.2052 20.7286 11.3526C20.1351 10.5 18.8443 10.5 16.2627 10.5Z" />
                        <path
                            d="M19 8C19 7.53406 19 7.30109 18.9239 7.11732C18.8224 6.87229 18.6277 6.67761 18.3827 6.57612C18.1989 6.5 17.9659 6.5 17.5 6.5H6.5C6.03406 6.5 5.80109 6.5 5.61732 6.57612C5.37229 6.67761 5.17761 6.87229 5.07612 7.11732C5 7.30109 5 7.53406 5 8" />
                        <path
                            d="M16.5 4C16.5 3.53406 16.5 3.30109 16.4239 3.11732C16.3224 2.87229 16.1277 2.67761 15.8827 2.57612C15.6989 2.5 15.4659 2.5 15 2.5H9C8.53406 2.5 8.30109 2.5 8.11732 2.57612C7.87229 2.67761 7.67761 2.87229 7.57612 3.11732C7.5 3.30109 7.5 3.53406 7.5 4" />
                    </svg>
                    <h2>Library</h2>
                </div>
                <div class="songList flex">
                    <ul>
                    </ul>
                </div>
                <div class="footer flex align-items">
                    <div class="links">
                        <a href="https://www.spotify.com/in-en/legal/">Legal</a>
                        <a href="https://www.spotify.com/in-en/safetyandprivacy/">Safety & Privacy Center</a>
                        <a href="https://www.spotify.com/in-en/legal/privacy-policy/">Privacy Policy</a>
                        <a href="https://www.spotify.com/in-en/legal/cookies-policy/">Cookies</a>
                        <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3">About Ads</a>
                        <a href="https://www.spotify.com/in-en/accessibility/">Accessibility</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="right bg-grey rounded">
            <div class="navBar flex align-items rounded m-1">
                <div class="arrows flex align-items" style="margin-left: 10px;">
                    <img class="hamberger invert" src="hamburger.svg" alt="">
                    <svg class="invert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        fill="none" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" />
                    </svg>
                    <svg class="invert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none" stroke="#141B34" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" />
                    </svg>
                </div>
                <div class="navButtons flex justify-content align-items">
                    <button class="SignUp">Sign Up</button>
                    <button class="LogIn">Log IN</button>
                </div>
            </div>
            <div class="SpotifyPlaylist m-1">
                <h1>Spotify Playlist</h1>
                <div class="cardContainer flex">
                    
                </div>
            </div>
            <div class="playBar rounded">
                <div class="songNames">
                </div>
                <div class="bar_seek flex justify-content">
                    <div class="songPlayers">
                        <img class="previous invert" src="previous-song.svg" style="width: 24px; height: 24px;" alt="">
                        <img class="playy invert" src="play_now.svg" style="width: 24px; height: 24px;" alt="">
                        <img class="next invert" src="next-song.svg" style="width: 24px; height: 24px;" alt="">
                    </div>
                    <div class="seekbar">
                        <div class="circle"></div>
                    </div>
                </div>
                <div class="timeVol">
                    <div class="songTime flex align-items">
                        <div class="time">00:00 / 00:00</div>
                        <div class="volume invert flex align-items">
                            <img src="volume.svg" alt="">
                            <div class="range">
                                <input type="range" name="volume">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="spotify.js"></script>
</body>

</html>
